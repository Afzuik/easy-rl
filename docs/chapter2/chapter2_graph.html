<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第 2 章 马尔可夫决策过程 — 知识图谱</title>

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: #0f172a;
    overflow: hidden;
    height: 100vh;
  }

  /* KaTeX dark */
  .katex { color: #e2e8f0; }
  #tooltip .katex { color: #f1f5f9; font-size: 1.02em; }

  #header {
    position: fixed; top: 16px; left: 24px;
    font-size: 20px; font-weight: 700; color: #e2e8f0;
    z-index: 10; pointer-events: none; letter-spacing: .3px;
  }
  #header span { color: #64748b; font-weight: 400; font-size: 15px; margin-left: 8px; }

  svg { width: 100vw; height: 100vh; }

  .node { cursor: pointer; }
  .node rect { rx: 8; ry: 8; transition: filter 0.2s; }
  .node:hover rect { filter: brightness(1.3) drop-shadow(0 0 10px rgba(255,255,255,0.15)); }
  .node text {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    pointer-events: none;
  }

  .link {
    fill: none; stroke: #334155; stroke-width: 2;
    stroke-linecap: round; transition: stroke 0.2s;
  }
  .link:hover { stroke: #64748b; }

  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(15, 23, 42, 0.96); color: #e2e8f0;
    padding: 12px 16px; border-radius: 12px; font-size: 13px;
    border: 1px solid #334155;
    opacity: 0; transition: opacity 0.15s;
    max-width: 400px; line-height: 1.7; z-index: 20;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }
  #tooltip b { font-size: 14px; }
  #tooltip .cat { font-size: 10px; color: #64748b; margin-bottom: 4px; }

  #legend {
    position: fixed; bottom: 20px; left: 24px;
    display: flex; gap: 18px; font-size: 11px; color: #94a3b8; z-index: 10;
    background: rgba(15,23,42,0.8); padding: 10px 18px; border-radius: 10px;
    border: 1px solid #1e293b;
  }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg span { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div id="header">🧠 马尔可夫决策过程 <span>第 2 章 · 知识图谱</span></div>
<div id="tooltip"></div>
<div id="legend">
  <div class="leg"><span style="background:#ef4444"></span> MP / 基础</div>
  <div class="leg"><span style="background:#f59e0b"></span> MRP / 价值</div>
  <div class="leg"><span style="background:#3b82f6"></span> MDP / 策略</div>
  <div class="leg"><span style="background:#8b5cf6"></span> 控制 / 最优</div>
  <span style="color:#475569">| 🖱 滚轮缩放 · 拖拽平移 · 悬停看详情</span>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>window.d3||document.write('<script src="https://cdn.bootcdn.net/ajax/libs/d3/7.9.0/d3.min.js"><\/script>');</script>
<script>
// ───────── KaTeX helper ─────────
function renderMath(el) {
  if (typeof renderMathInElement !== 'function') return;
  try {
    renderMathInElement(el, {
      delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError: false, trust: true
    });
  } catch(e){}
}

// ───────── DATA ─────────
const treeData = {
  name: "第2章 马尔可夫决策过程",
  color: "#38bdf8", cat: "",
  desc: "强化学习的基本框架：智能体与环境交互的序列决策模型。从 MP $\\to$ MRP $\\to$ MDP 逐步引入状态、奖励、动作与策略。",
  children: [
    {
      name: "2.1 马尔可夫过程 (MP)",
      color: "#ef4444", cat: "MP",
      desc: "具有马尔可夫性质的随机变量序列 $s_1,\\ldots,s_t$。这是整个框架的起点。",
      children: [
        { name: "马尔可夫性质", color: "#ef4444", cat: "MP",
          desc: "$p(X_{t+1}\\mid X_{0:t}) = p(X_{t+1}\\mid X_t)$。未来仅取决于当前，与历史条件独立。" },
        { name: "马尔可夫链", color: "#ef4444", cat: "MP",
          desc: "离散时间、有限状态的马尔可夫过程。状态在有限集合中按概率转移。",
          children: [
            { name: "状态转移矩阵 P", color: "#dc2626", cat: "MP",
              desc: "$p(s'\\mid s)$：每行描述当前状态到所有后继状态的概率分布，$\\sum_j P_{ij} = 1$。" }
          ]},
      ]
    },
    {
      name: "2.2 马尔可夫奖励过程 (MRP)",
      color: "#f59e0b", cat: "MRP",
      desc: "MP + 奖励函数 $R(s)$ + 折扣因子 $\\gamma$。引入「价值」概念。",
      children: [
        { name: "回报 G_t", color: "#f59e0b", cat: "MRP",
          desc: "$G_t = r_{t+1} + \\gamma r_{t+2} + \\gamma^2 r_{t+3} + \\ldots + \\gamma^{T-t-1}r_T$。从时刻 $t$ 开始的折扣累积奖励。" },
        { name: "价值函数 V(s)", color: "#f59e0b", cat: "MRP",
          desc: "$V(s) = \\mathbb{E}[G_t \\mid s_t=s]$。从状态 $s$ 出发的折扣回报期望，衡量状态优劣。" },
        { name: "折扣因子 γ ∈ [0,1]", color: "#ea580c", cat: "MRP",
          desc: "$\\gamma \\to 0$ 目光短浅；$\\gamma \\to 1$ 看重远期。数学上保证无穷级数收敛。" },
        { name: "贝尔曼方程", color: "#f59e0b", cat: "MRP",
          desc: "$V(s) = R(s) + \\gamma \\sum_{s'} p(s'\\mid s) V(s')$。即时奖励 + 折扣后继价值的期望。",
          children: [
            { name: "矩阵解 V=(I−γP)⁻¹R", color: "#ea580c", cat: "MRP",
              desc: "贝尔曼方程的闭式解：$V = (I - \\gamma P)^{-1}R$。复杂度 $O(N^3)$，仅适用 $N<1000$。" }
          ]},
        { name: "蒙特卡洛 (MC)", color: "#22c55e", cat: "方法",
          desc: "采样完整轨迹 $\\to$ 计算回报 $\\to$ 取平均估计 $V(s)$。无自举，必须等到回合结束。" },
        { name: "动态规划 (DP)", color: "#22c55e", cat: "方法",
          desc: "反复迭代贝尔曼方程直至 $V$ 收敛。使用自举。需已知 MDP 模型。",
          children: [
            { name: "自举 (Bootstrapping)", color: "#16a34a", cat: "方法",
              desc: "用后继状态的估计值更新当前状态。DP 与 TD 的核心，MC 不使用。" }
          ]},
        { name: "时序差分 (TD)", color: "#22c55e", cat: "方法",
          desc: "MC 的采样 + DP 的自举。免模型、在线学习。$\\to$ 第 3 章详述。" }
      ]
    },
    {
      name: "2.3 马尔可夫决策过程 (MDP)",
      color: "#3b82f6", cat: "MDP",
      desc: "MRP + 动作 $a$ + 策略 $\\pi$。转移 $p(s'\\mid s,a)$ 和奖励 $R(s,a)$ 均依赖动作。强化学习核心框架。",
      children: [
        { name: "策略 π(a|s)", color: "#3b82f6", cat: "MDP",
          desc: "给定状态 $s$，选择各动作的概率分布。智能体的行为规则（平稳策略）。" },
        { name: "MDP → MRP 化简", color: "#3b82f6", cat: "MDP",
          desc: "给定 $\\pi$：$P_\\pi(s'\\mid s)=\\sum_a \\pi(a\\mid s)p(s'\\mid s,a)$；$R_\\pi(s)=\\sum_a \\pi(a\\mid s)R(s,a)$。消去动作维度。" },
        { name: "V_π(s) 与 Q_π(s,a)", color: "#3b82f6", cat: "MDP",
          desc: "$V_\\pi(s)=\\mathbb{E}_\\pi[G_t\\mid s_t=s]$；$Q_\\pi(s,a)=\\mathbb{E}_\\pi[G_t\\mid s_t=s,a_t=a]$。$V$ 评价状态，$Q$ 评价状态-动作对。",
          children: [
            { name: "V ↔ Q 关系", color: "#60a5fa", cat: "MDP",
              desc: "$V_\\pi(s)=\\sum_a \\pi(a\\mid s)Q_\\pi(s,a)$；$Q_\\pi(s,a)=R(s,a)+\\gamma\\sum_{s'}p(s'\\mid s,a)V_\\pi(s')$。两者可相互推导。" }
          ]},
        { name: "贝尔曼期望方程", color: "#2563eb", cat: "MDP",
          desc: "$V_\\pi(s)=\\mathbb{E}_\\pi[r_{t+1}+\\gamma V_\\pi(s_{t+1})\\mid s_t=s]$。定义当前价值与后继价值的迭代关系。",
          children: [
            { name: "备份图", color: "#60a5fa", cat: "MDP",
              desc: "空心圆 = 状态，实心圆 = 动作。可视化价值从后继反向传播到当前节点的信息流。" }
          ]},
        { name: "预测：策略评估", color: "#22c55e", cat: "方法",
          desc: "输入 MDP + $\\pi$ $\\to$ 输出 $V_\\pi$。贝尔曼期望备份反复迭代至收敛。" },
        { name: "控制：寻找最优策略", color: "#8b5cf6", cat: "最优",
          desc: "输入 MDP $\\to$ 输出 $V^*$ 与 $\\pi^*$。使每个状态价值最大化的策略。",
          children: [
            { name: "V*(s) 与 π*", color: "#8b5cf6", cat: "最优",
              desc: "$V^*(s)=\\max_\\pi V_\\pi(s)$；$\\pi^*(s)=\\arg\\max_\\pi V_\\pi(s)$。最优策略可能不唯一，但 $V^*$ 唯一。" },
            { name: "贝尔曼最优方程", color: "#7c3aed", cat: "最优",
              desc: "$V^*(s)=\\max_a\\big[R(s,a)+\\gamma\\sum_{s'}p(s'\\mid s,a)V^*(s')\\big]$。最优策略的理论基石。",
              children: [
                { name: "Q 表格", color: "#a78bfa", cat: "最优",
                  desc: "行 = 状态，列 = 动作。每行 $\\arg\\max$ 即最优动作。$\\to$ 第 3 章核心数据结构。" }
              ]},
            { name: "策略迭代", color: "#8b5cf6", cat: "最优",
              desc: "策略评估 + 策略改进 交替进行。使用贝尔曼期望方程。收敛快但每轮评估开销大。",
              children: [
                { name: "策略改进", color: "#a78bfa", cat: "最优",
                  desc: "$\\pi_{i+1}(s)=\\arg\\max_a Q_{\\pi_i}(s,a)$。对 $Q$ 贪心。" }
              ]},
            { name: "价值迭代", color: "#8b5cf6", cat: "最优",
              desc: "直接用贝尔曼最优方程迭代 $V$。中间结果无实际意义，收敛后一次性提取 $\\pi^*$。",
              children: [
                { name: "最优性原理", color: "#a78bfa", cat: "最优",
                  desc: "$\\pi$ 在 $s$ 达 $V^*(s)$ $\\iff$ 对所有可达后继 $s'$ 均已达 $V^*(s')$。" }
              ]},
          ]},
      ]
    }
  ]
};

// ───────── LAYOUT ─────────
const W = window.innerWidth, H = window.innerHeight;
const dx = 200, dy = 52;

const svg = d3.select("body").append("svg").attr("width", W).attr("height", H);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.12, 2.5])
  .on("zoom", ev => g.attr("transform", ev.transform)));

const root = d3.hierarchy(treeData);
d3.tree().nodeSize([dy, dx])(root);

let x0 = Infinity, x1 = -x0;
root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
const OX = 100, OY = H/2 - (x0+x1)/2;
root.each(d => { d.y += OX; d.x += OY; });

// ───────── RENDER ─────────
const defs = svg.append("defs");
defs.append("filter").attr("id","card-shadow").html(
  '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>');

g.append("g")
  .selectAll("path").data(root.links()).join("path")
  .attr("class", "link")
  .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

const nodeG = g.append("g")
  .selectAll("g").data(root.descendants()).join("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.y},${d.x})`);

const tmpText = svg.append("text")
  .style("font-family","'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif")
  .style("font-size","12.5px").style("font-weight","600")
  .style("visibility","hidden");
const textW = d => { tmpText.text(d.data.name); return tmpText.node().getComputedTextLength(); };
tmpText.remove();

nodeG.append("rect")
  .attr("x", d => { const w = textW(d); return d.depth===0 ? -w/2-14 : -8; })
  .attr("y", -13)
  .attr("width", d => { const w = textW(d); return d.depth===0 ? w+28 : w+16; })
  .attr("height", 26)
  .attr("fill", d => d.data.color)
  .attr("fill-opacity", d => d.depth===0 ? 0.25 : d.children ? 0.2 : 0.14)
  .attr("stroke", d => d.data.color)
  .attr("stroke-opacity", 0.45)
  .attr("stroke-width", 1.2)
  .attr("filter", "url(#card-shadow)");

nodeG.filter(d => d.depth > 0).append("circle")
  .attr("cx", -13).attr("cy", 0)
  .attr("r", d => d.children ? 5 : 3.5)
  .attr("fill", d => d.data.color);

nodeG.append("text")
  .text(d => d.data.name)
  .attr("x", 0).attr("y", 4.5)
  .attr("text-anchor", d => d.depth===0 ? "middle" : "start")
  .attr("fill", "#e2e8f0")
  .style("font-size", d => d.depth<=1 ? "13px" : "12px")
  .style("font-weight", d => d.depth<=1 ? 700 : 500)
  .style("letter-spacing", ".2px");

// ───────── TOOLTIP ─────────
const tip = d3.select("#tooltip");
const tipBody = tip.node();
nodeG.on("mouseenter", (ev, d) => {
  tip.style("opacity","1").html(`
    <div class="cat">${d.data.cat ? '📂 ' + d.data.cat : '📖 根节点'}</div>
    <b style="color:${d.data.color}">${d.data.name}</b>
    <div style="color:#cbd5e1;font-size:12px;margin-top:5px;">${d.data.desc||''}</div>
  `);
  renderMath(tipBody);
}).on("mousemove", ev => {
  tip.style("left",(ev.pageX+16)+"px").style("top",(ev.pageY-12)+"px");
}).on("mouseleave", () => tip.style("opacity","0"));

// ───────── INITIAL FIT ─────────
setTimeout(() => {
  const bb = g.node().getBBox();
  const s = Math.min(0.85, W/bb.width, H/bb.height);
  const tx = (W - bb.width*s)/2 - bb.x*s;
  const ty = (H - bb.height*s)/2 - bb.y*s;
  svg.transition().duration(600)
    .call(d3.zoom().transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}, 100);
</script>
</body>
</html>
