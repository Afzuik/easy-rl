<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3章 表格型方法 — 知识图谱</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: #0f172a;
    overflow: hidden;
    height: 100vh;
  }

  .katex { color: #e2e8f0; }
  #tooltip .katex { color: #f1f5f9; font-size: 1.02em; }

  #header {
    position: fixed; top: 16px; left: 24px;
    font-size: 20px; font-weight: 700; color: #e2e8f0;
    z-index: 10; pointer-events: none; letter-spacing: .3px;
  }
  #header span { color: #64748b; font-weight: 400; font-size: 15px; margin-left: 8px; }

  svg { width: 100vw; height: 100vh; }

  .node { cursor: pointer; }
  .node rect { rx: 8; ry: 8; transition: filter 0.2s; }
  .node:hover rect { filter: brightness(1.3) drop-shadow(0 0 10px rgba(255,255,255,0.15)); }
  .node text {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    pointer-events: none;
  }

  .link {
    fill: none; stroke: #334155; stroke-width: 2;
    stroke-linecap: round; transition: stroke 0.2s;
  }
  .link:hover { stroke: #64748b; }

  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(15, 23, 42, 0.96); color: #e2e8f0;
    padding: 12px 16px; border-radius: 12px; font-size: 13px;
    border: 1px solid #334155;
    opacity: 0; transition: opacity 0.15s;
    max-width: 400px; line-height: 1.7; z-index: 20;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }
  #tooltip b { font-size: 14px; }
  #tooltip .cat { font-size: 10px; color: #64748b; margin-bottom: 4px; }

  #legend {
    position: fixed; bottom: 20px; left: 24px;
    display: flex; gap: 18px; font-size: 11px; color: #94a3b8; z-index: 10;
    background: rgba(15,23,42,0.8); padding: 10px 18px; border-radius: 10px;
    border: 1px solid #1e293b;
  }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg span { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div id="header">🧠 表格型方法 <span>第 3 章 · 知识图谱</span></div>
<div id="tooltip"></div>
<div id="legend">
  <div class="leg"><span style="background:#3b82f6"></span> MDP 回顾</div>
  <div class="leg"><span style="background:#f59e0b"></span> Q表格与价值</div>
  <div class="leg"><span style="background:#8b5cf6"></span> 免模型预测</div>
  <div class="leg"><span style="background:#ef4444"></span> 免模型控制</div>
  <span style="color:#475569">| 🖱 滚轮缩放 · 拖拽平移 · 悬停看详情</span>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>window.d3||document.write('<script src="https://cdn.bootcdn.net/ajax/libs/d3/7.9.0/d3.min.js"><\/script>');</script>
<script>
function renderMath(el) {
  if (typeof renderMathInElement !== 'function') return;
  try { renderMathInElement(el, {
    delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
    throwOnError: false, trust: true
  }); } catch(e){}
}

const treeData = {
  name: "第3章 表格型方法",
  color: "#38bdf8", cat: "",
  desc: "基于查找表的强化学习方法（蒙特卡洛、$Q$学习、Sarsa）。使用表格型策略表示价值函数，讲解基于价值的方法求解 RL。",
  children: [
    // =========== 3.1 MDP 回顾 ===========
    {
      name: "3.1 马尔可夫决策过程回顾",
      color: "#3b82f6", cat: "MDP",
      desc: "序列决策的经典框架。状态、动作、转移概率、奖励 $(S,A,P,R)$ 构成四元组，加 $\\gamma$ 成五元组。",
      children: [
        { name: "有模型", color: "#3b82f6", cat: "MDP",
          desc: "$P$ 和 $R$ 已知。可直接用动态规划（策略迭代 / 价值迭代）求解最优策略。需贝尔曼期望备份。",
          children: [
            { name: "贝尔曼期望备份", color: "#60a5fa", cat: "MDP",
              desc: "$V_i(s)\\!\\leftarrow\\!\\sum_a\\pi(a|s)\\big[R(s,a)+\\gamma\\sum_{s'}\\!P(s'|s,a)V_{i-1}(s')\\big]$，两层求和。" }
          ]},
        { name: "免模型", color: "#3b82f6", cat: "MDP",
          desc: "$P$ 和 $R$ 未知。智能体通过与环境交互采集轨迹数据，从经验中学习。本章核心内容。" },
        { name: "马尔可夫性质", color: "#3b82f6", cat: "MDP",
          desc: "$p[s_{t+1},r_t\\mid s_t,a_t]$：下一时刻仅由当前状态和动作决定，与历史无关。" },
      ]
    },

    // =========== 3.2 Q表格 ===========
    {
      name: "3.2 Q表格与价值",
      color: "#f59e0b", cat: "Q表格",
      desc: "$|S|\\times|A|$ 的查找表，存储每个状态-动作对的估计价值 $Q(s,a)$。初始化为 $0$，通过交互逐步更新。",
      children: [
        { name: "状态动作价值 Q(s,a)", color: "#f59e0b", cat: "Q表格",
          desc: "$Q_\\pi(s,a)=\\mathbb{E}_\\pi[G_t\\mid s_t=s,a_t=a]$。在状态 $s$ 采取 $a$ 后遵循 $\\pi$ 的期望累积奖励。" },
        { name: "状态价值 V(s)", color: "#f59e0b", cat: "Q表格",
          desc: "$V_\\pi(s)=\\mathbb{E}_\\pi[G_t\\mid s_t=s]$。评价状态好坏，可从 $Q$ 推导。" },
        { name: "折扣因子 γ ∈ [0,1]", color: "#ea580c", cat: "Q表格",
          desc: "$\\gamma=0$ 目光短浅（单步奖励）；$\\gamma=1$ 目光长远（全部累加）；$\\gamma=0.6$ 折中。$\\gamma^n\\to0$。" },
        { name: "悬崖行走问题", color: "#ea580c", cat: "Q表格",
          desc: "从 $S$ 到 $G$，避开悬崖。每步 $-1$，掉崖 $-100$ 且重置。经典例题演示 $\\gamma$ 与探索的影响。" },
        { name: "时序差分目标", color: "#f59e0b", cat: "Q表格",
          desc: "$r_{t+1}+\\gamma V(s_{t+1})$：实际奖励 + 自举估计。作为 $V(s_t)$ 更新时的逼近目标。" },
      ]
    },

    // =========== 3.3 免模型预测 ===========
    {
      name: "3.3 免模型预测",
      color: "#8b5cf6", cat: "预测",
      desc: "MDP 模型未知时，通过采样轨迹估计给定策略 $\\pi$ 的价值函数。核心方法：MC 与 TD。",
      children: [
        { name: "蒙特卡洛 (MC)", color: "#8b5cf6", cat: "预测",
          desc: "纯采样方法。跑完完整轨迹 $\\to$ 用实际回报 $G_t$ 的平均估计 $V(s)$。无自举，必须有终止。",
          children: [
            { name: "增量式 MC", color: "#a78bfa", cat: "预测",
              desc: "$V(s_t)\\leftarrow V(s_t)+\\alpha(G_t-V(s_t))$。用 $\\alpha$ 替代 $1/N(s_t)$ 控制更新速率。" },
            { name: "经验平均回报", color: "#a78bfa", cat: "预测",
              desc: "取所有访问 $s$ 的轨迹回报算术平均。大数定律：$N\\to\\infty$ 时收敛到 $V_\\pi(s)$。" },
          ]},
        { name: "时序差分 (TD)", color: "#8b5cf6", cat: "预测",
          desc: "免模型 + 自举。每走一步即更新。可从不完整序列学习，支持连续任务。",
          children: [
            { name: "TD(0) 单步更新", color: "#a78bfa", cat: "预测",
              desc: "$V(s_t)\\leftarrow V(s_t)+\\alpha\\big[r_{t+1}+\\gamma V(s_{t+1})-V(s_t)\\big]$。最小计算开销。" },
            { name: "n 步时序差分", color: "#a78bfa", cat: "预测",
              desc: "$n=1$ 即 TD(0)，$n=\\infty$ 即 MC。调节 $n$ 权衡偏差（TD 有偏低方差）与方差（MC 无偏高方差）。" },
            { name: "Sarsa(λ)", color: "#a78bfa", cat: "预测",
              desc: "资格迹衰减 $\\lambda$ 对 $n$ 步回报加权：$Q_t^\\lambda=(1-\\lambda)\\sum_{n=1}^{\\infty}\\lambda^{n-1}Q_t^n$。" },
          ]},
        { name: "自举 vs 采样", color: "#7c3aed", cat: "预测",
          desc: "DP = 自举 ✓ + 采样 ✗；MC = 自举 ✗ + 采样 ✓；TD = 自举 ✓ + 采样 ✓。TD 兼顾两者。" },
        { name: "增量式学习", color: "#a78bfa", cat: "预测",
          desc: "$\\mu_t=\\mu_{t-1}+\\frac{1}{t}(x_t-\\mu_{t-1})$。经验均值转增量均值，支持在线更新。" },
      ]
    },

    // =========== 3.4 免模型控制 ===========
    {
      name: "3.4 免模型控制",
      color: "#ef4444", cat: "控制",
      desc: "未知模型下优化策略。通过广义策略迭代 (GPI) 交替进行策略评估与策略改进。",
      children: [
        { name: "广义策略迭代 (GPI)", color: "#ef4444", cat: "控制",
          desc: "策略评估（估算 $Q$）+ 策略改进（贪心于 $Q$）来回迭代。评估可用 MC 或 TD。",
          children: [
            { name: "ε-贪心探索", color: "#f87171", cat: "控制",
              desc: "以 $1-\\varepsilon$ 概率取 $\\arg\\max_a Q(s,a)$，$\\varepsilon$ 概率随机。$\\varepsilon$ 随时间递减。保证 $V_{\\pi'}\\geqslant V_\\pi$。" }
          ]},
        { name: "Sarsa（同策略）", color: "#ef4444", cat: "控制",
          desc: "On-policy TD 控制。行为策略 = 目标策略，保守安全。名称源自 $(s_t,a_t,r_{t+1},s_{t+1},a_{t+1})$。",
          children: [
            { name: "Sarsa 更新公式", color: "#f87171", cat: "控制",
              desc: "$Q(s_t,a_t)\\leftarrow Q(s_t,a_t)+\\alpha\\big[r_{t+1}+\\gamma Q(s_{t+1},a_{t+1})-Q(s_t,a_t)\\big]$。" },
            { name: "n 步 Sarsa", color: "#f87171", cat: "控制",
              desc: "$n=1$ 单步 Sarsa，$n=2$ 两步更新，…，$n=\\infty$ 退化为 MC 控制。" },
            { name: "同策略特点", color: "#f87171", cat: "控制",
              desc: "用实际下一步动作 $a_{t+1}$ 更新。会主动远离悬崖，确保探索时也在安全区域。" },
          ]},
        { name: "Q学习（异策略）", color: "#ef4444", cat: "控制",
          desc: "Off-policy TD 控制。行为策略 $\\mu$ $\\neq$ 目标策略 $\\pi$。激进、直奔最优。",
          children: [
            { name: "Q学习 更新公式", color: "#f87171", cat: "控制",
              desc: "$Q(s_t,a_t)\\leftarrow Q(s_t,a_t)+\\alpha\\big[r_{t+1}+\\gamma\\max_a Q(s_{t+1},a)-Q(s_t,a_t)\\big]$。" },
            { name: "目标策略 π", color: "#f87171", cat: "控制",
              desc: "待学习的最优策略。直接取 $\\arg\\max Q$，不需与环境交互，专心学习。" },
            { name: "行为策略 μ", color: "#f87171", cat: "控制",
              desc: "与环境交互产生轨迹。通常用 $\\varepsilon$-greedy 于 $Q$ 表，负责探索并采集数据。" },
          ]},
        { name: "On-policy vs Off-policy", color: "#dc2626", cat: "控制",
          desc: "Sarsa 同策略：用 $a_{t+1}$ 更新，保守。$Q$ 学习异策略：用 $\\max Q$ 更新，激进。两者公式唯目标计算不同。" },
      ]
    }
  ]
};

// ───────── LAYOUT ─────────
const W = window.innerWidth, H = window.innerHeight;
const dx = 210, dy = 50;

const svg = d3.select("body").append("svg").attr("width", W).attr("height", H);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.12, 2.5])
  .on("zoom", ev => g.attr("transform", ev.transform)));

const root = d3.hierarchy(treeData);
d3.tree().nodeSize([dy, dx])(root);

let x0 = Infinity, x1 = -x0;
root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
const OX = 100, OY = H/2 - (x0+x1)/2;
root.each(d => { d.y += OX; d.x += OY; });

// ───────── RENDER ─────────
const defs = svg.append("defs");
defs.append("filter").attr("id","card-shadow").html(
  '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>');

g.append("g")
  .selectAll("path").data(root.links()).join("path")
  .attr("class", "link")
  .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

const nodeG = g.append("g")
  .selectAll("g").data(root.descendants()).join("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.y},${d.x})`);

const tmpText = svg.append("text")
  .style("font-family","'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif")
  .style("font-size","12.5px").style("font-weight","600")
  .style("visibility","hidden");
const textW = d => { tmpText.text(d.data.name); return tmpText.node().getComputedTextLength(); };
tmpText.remove();

nodeG.append("rect")
  .attr("x", d => { const w = textW(d); return d.depth===0 ? -w/2-14 : -8; })
  .attr("y", -13)
  .attr("width", d => { const w = textW(d); return d.depth===0 ? w+28 : w+16; })
  .attr("height", 26)
  .attr("fill", d => d.data.color)
  .attr("fill-opacity", d => d.depth===0 ? 0.25 : d.children ? 0.2 : 0.14)
  .attr("stroke", d => d.data.color)
  .attr("stroke-opacity", 0.45)
  .attr("stroke-width", 1.2)
  .attr("filter", "url(#card-shadow)");

nodeG.filter(d => d.depth > 0).append("circle")
  .attr("cx", -13).attr("cy", 0)
  .attr("r", d => d.children ? 5 : 3.5)
  .attr("fill", d => d.data.color);

nodeG.append("text")
  .text(d => d.data.name)
  .attr("x", 0).attr("y", 4.5)
  .attr("text-anchor", d => d.depth===0 ? "middle" : "start")
  .attr("fill", "#e2e8f0")
  .style("font-size", d => d.depth<=1 ? "13px" : "12px")
  .style("font-weight", d => d.depth<=1 ? 700 : 500)
  .style("letter-spacing", ".2px");

// ───────── TOOLTIP ─────────
const tip = d3.select("#tooltip");
const tipNode = tip.node();
nodeG.on("mouseenter", (ev, d) => {
  tip.style("opacity","1").html(`
    <div class="cat">${d.data.cat ? '📂 ' + d.data.cat : '📖 根节点'}</div>
    <b style="color:${d.data.color}">${d.data.name}</b>
    <div style="color:#cbd5e1;font-size:12px;margin-top:5px;">${d.data.desc||''}</div>
  `);
  renderMath(tipNode);
}).on("mousemove", ev => {
  tip.style("left",(ev.pageX+16)+"px").style("top",(ev.pageY-12)+"px");
}).on("mouseleave", () => tip.style("opacity","0"));

// ───────── INITIAL FIT ─────────
setTimeout(() => {
  const bb = g.node().getBBox();
  const s = Math.min(0.85, W/bb.width, H/bb.height);
  const tx = (W - bb.width*s)/2 - bb.x*s;
  const ty = (H - bb.height*s)/2 - bb.y*s;
  svg.transition().duration(600)
    .call(d3.zoom().transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}, 100);
</script>
</body>
</html>
