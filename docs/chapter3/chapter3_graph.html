<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3章 表格型方法 — 知识图谱</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: #0f172a;
    overflow: hidden;
    height: 100vh;
  }

  .katex { color: #e2e8f0; }
  #tooltip .katex { color: #f1f5f9; font-size: 1.02em; }

  #header {
    position: fixed; top: 16px; left: 24px;
    font-size: 20px; font-weight: 700; color: #e2e8f0;
    z-index: 10; pointer-events: none; letter-spacing: .3px;
  }
  #header span { color: #64748b; font-weight: 400; font-size: 15px; margin-left: 8px; }

  svg { width: 100vw; height: 100vh; }

  .node { cursor: pointer; }
  .node rect { rx: 8; ry: 8; transition: filter 0.2s; }
  .node:hover rect { filter: brightness(1.3) drop-shadow(0 0 10px rgba(255,255,255,0.15)); }
  .node text {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    pointer-events: none;
  }

  .link {
    fill: none; stroke: #334155; stroke-width: 2;
    stroke-linecap: round; transition: stroke 0.2s;
  }
  .link:hover { stroke: #64748b; }

  #tooltip {
    position: absolute; pointer-events: none;
    background: rgba(15, 23, 42, 0.96); color: #e2e8f0;
    padding: 12px 16px; border-radius: 12px; font-size: 13px;
    border: 1px solid #334155;
    opacity: 0; transition: opacity 0.15s;
    max-width: 420px; line-height: 1.7; z-index: 20;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
  }
  #tooltip b { font-size: 14px; }
  #tooltip .cat { font-size: 10px; color: #64748b; margin-bottom: 4px; }

  #legend {
    position: fixed; bottom: 20px; left: 24px;
    display: flex; gap: 18px; font-size: 11px; color: #94a3b8; z-index: 10;
    background: rgba(15,23,42,0.8); padding: 10px 18px; border-radius: 10px;
    border: 1px solid #1e293b;
  }
  .leg { display: flex; align-items: center; gap: 6px; }
  .leg span { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div id="header">🧠 表格型方法 <span>第 3 章 · 知识图谱（整理版）</span></div>
<div id="tooltip"></div>
<div id="legend">
  <div class="leg"><span style="background:#3b82f6"></span> 一、动机</div>
  <div class="leg"><span style="background:#f59e0b"></span> 二、Q表格</div>
  <div class="leg"><span style="background:#8b5cf6"></span> 三、预测</div>
  <div class="leg"><span style="background:#ef4444"></span> 四、控制</div>
  <div class="leg"><span style="background:#64748b"></span> 总结</div>
  <span style="color:#475569">| 🖱 滚轮缩放 · 拖拽平移 · 悬停看详情</span>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>window.d3||document.write('<script src="https://cdn.bootcdn.net/ajax/libs/d3/7.9.0/d3.min.js"><\/script>');</script>
<script>
function renderMath(el) {
  if (typeof renderMathInElement !== 'function') return;
  try { renderMathInElement(el, {
    delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
    throwOnError: false, trust: true
  }); } catch(e){}
}const treeData = {
  name: "第3章 表格型方法",
  color: "#38bdf8", cat: "",
  desc: "基于查找表的免模型强化学习。四大板块：有模型→免模型动机 → Q表格工具 → 预测 MC/TD → 控制 Sarsa/Q-learning。",
  children: [

    // =========== 一、从有模型到免模型 ===========
    {
      name: "一、从有模型到免模型",
      color: "#3b82f6", cat: "3.1 动机",
      desc: "第2章的DP需要已知 $P$ 和 $R$，现实世界通常不知道。本章的方法：不依赖模型，从交互经验中直接学习。",
      children: [
        { name: "有模型：已知 P & R → DP", color: "#3b82f6", cat: "3.1",
          desc: "已知状态转移和奖励函数时，动态规划（策略迭代/价值迭代）直接求解。环境像透明棋盘，一切可见。",
          children: [
            { name: "贝尔曼期望备份", color: "#60a5fa", cat: "3.1 有模型",
              desc: "$V_i(s)\\leftarrow\\sum_a\\pi(a|s)[R+\\gamma\\sum_{s'}PV_{i-1}(s')]$。全宽更新，需要模型。" }
          ]},
        { name: "免模型：未知 P & R → 试错学习", color: "#3b82f6", cat: "3.1",
          desc: "$P$ 和 $R$ 均未知。智能体像盲人摸象——只能通过试错交互，从采集的轨迹中归纳经验。本章全部算法属于此类。" },
        { name: "对比：有模型 vs 免模型", color: "#3b82f6", cat: "3.1",
          desc: "有模型 = 规划（内部模拟）；免模型 = 学习（真实交互）。免模型泛化性更好，但数据效率较低。" },
        { name: "马尔可夫性质回顾", color: "#3b82f6", cat: "3.1",
          desc: "$p[s_{t+1},r_t|s_t,a_t]$：下一时刻仅与当前 $(s_t,a_t)$ 有关。序列决策的数学根基。" },
      ]
    },

    // =========== 二、Q表格 — 免模型的价值载体 ===========
    {
      name: "二、Q表格 · 价值载体",
      color: "#f59e0b", cat: "3.2 工具",
      desc: "免模型下必须直接学 $Q(s,a)$ 而非 $V(s)$——因为不知道 $P$ 和 $R$，有了 $V$ 也算不出哪个动作好。$|S|\\times|A|$ 查找表是核心工具。",
      children: [
        { name: "Q函数：状态-动作价值", color: "#f59e0b", cat: "3.2",
          desc: "$Q_\\pi(s,a)=\\mathbb{E}_\\pi[G_t|s_t=s,a_t=a]$。有了 $Q$，最优动作直接 $\\arg\\max_a Q(s,a)$，无需模型。" },
        { name: "V函数：状态价值", color: "#f59e0b", cat: "3.2",
          desc: "$V_\\pi(s)=\\mathbb{E}_\\pi[G_t|s_t=s]$。可从 $Q$ 加权得到：$V_\\pi(s)=\\sum_a\\pi(a|s)Q_\\pi(s,a)$。" },
        { name: "Q表格的结构", color: "#ea580c", cat: "3.2",
          desc: "行=所有状态（坐标或编号），列=所有动作。初始全0，像一本逐步完善的生活手册：熊发怒时装死价值更高，熊离开时逃跑更划算。" },
        { name: "折扣因子 γ：目光长短", color: "#ea580c", cat: "3.2",
          desc: "$\\gamma=0$：只看眼前；$\\gamma=1$：无穷远。悬崖行走中 $\\gamma=0.6$：每步递推 $G_t=r_{t+1}+\\gamma G_{t+1}$。" },
      ]
    },

    // =========== 三、免模型预测 ===========
    {
      name: "三、免模型预测",
      color: "#8b5cf6", cat: "3.3-3.5 预测",
      desc: "问题：给定策略 $\\pi$，在不知道 $P$ 和 $R$ 下如何估计 $V_\\pi$？两条路：MC（走完再说）和 TD（走一步就学）。",
      children: [
        { name: "蒙特卡洛 MC ❮回合更新❯", color: "#8b5cf6", cat: "3.3 MC",
          desc: "跑完完整轨迹，用真实 $G_t$ 的平均估计 $V(s)$。无自举、不依赖模型。必须有终止状态。$V(s)=S(s)/N(s)$。",
          children: [
            { name: "增量式 MC", color: "#a78bfa", cat: "3.3 MC",
              desc: "$V(s_t)\\leftarrow V(s_t)+\\alpha(G_t-V(s_t))$。固定学习率替代 $1/N$。$\\alpha$ 大→适应快但波动；$\\alpha$ 小→稳定但慢。" },
            { name: "MC 局限", color: "#a78bfa", cat: "3.3 MC",
              desc: "回合必须结束才能更新 → 不适用于连续任务。高方差（轨迹随机性累积），但无偏。" },
          ]},
        { name: "时序差分 TD ❮单步更新❯", color: "#8b5cf6", cat: "3.4 TD",
          desc: "每走一步就更新：用 $r_{t+1}+\\gamma V(s_{t+1})$ 估计 $G_t$。自举 + 采样。可在线学习、从不完整序列学习、支持连续任务。",
          children: [
            { name: "TD(0) 核心公式", color: "#a78bfa", cat: "3.4 TD",
              desc: "$V(s_t)\\leftarrow V(s_t)+\\alpha[r_{t+1}+\\gamma V(s_{t+1})-V(s_t)]$。TD目标=即时奖励+自举估计。TD误差 $\\delta_t$ = 目标 $-$ 当前值。" },
            { name: "巴甫洛夫条件反射 ❬直觉❭", color: "#a78bfa", cat: "3.4 TD",
              desc: "铃声(中性刺激)+食物(无条件)→ 铃声也能引起唾液分泌。类比：奖励先强化最近的状态，再反向层层强化更早状态——这就是「强化」的本意。" },
            { name: "n 步 TD：MC↔TD 桥梁", color: "#a78bfa", cat: "3.4 TD",
              desc: "$G_t^n=r_{t+1}+\\cdots+\\gamma^{n-1}r_{t+n}+\\gamma^nV(s_{t+n})$。$n=1$=TD，$n=\\infty$=MC。调节 $n$ 权衡偏差与方差。" },
          ]},
        { name: "统一视角：自举×采样", color: "#7c3aed", cat: "3.5 统一",
          desc: "DP=自举✓+采样✗，MC=自举✗+采样✓，TD=自举✓+采样✓。广度↑→DP，深度↑→MC，TD在中间。" },
        { name: "偏差-方差权衡", color: "#7c3aed", cat: "3.5 统一",
          desc: "MC：无偏（用真实 $G_t$）但高方差（轨迹随机）。TD：有偏（$V(s')$初始不准）但低方差（只依赖单步）。$n$步TD折中。" },
        { name: "增量式学习 ❬数学基础❭", color: "#a78bfa", cat: "3.3/3.4 基础",
          desc: "$\\mu_t=\\mu_{t-1}+\\frac{1}{t}(x_t-\\mu_{t-1})$。旧均值+学习率×(新样本−旧均值)。MC和TD共用这一数学模式。" },
      ]
    },

    // =========== 四、免模型控制 ===========
    {
      name: "四、免模型控制",
      color: "#ef4444", cat: "3.6-3.9 控制",
      desc: "问题：未知模型下如何找到 $\\pi^*$？答案：GPI = MC/TD评估 $Q$ + $\\varepsilon$-贪心改进，反复交替。引出Sarsa和Q-learning。",
      children: [
        { name: "GPI 广义策略迭代", color: "#ef4444", cat: "3.6 GPI",
          desc: "策略迭代的免模型推广。评估(MC/TD估计$Q$) + 改进($\\varepsilon$-贪心选动作)交替进行。评估不必完全准确即可改进策略。",
          children: [
            { name: "ε-贪心探索", color: "#f87171", cat: "3.6",
              desc: "$1-\\varepsilon$ 利用($\\arg\\max Q$)，$\\varepsilon$ 探索(随机)。$\\varepsilon$ 从 0.5→0.01 线性衰减。保证单调改进：$V_{\\pi'}\\geqslant V_\\pi$。" },
            { name: "探索性开始 vs ε-贪心", color: "#f87171", cat: "3.6",
              desc: "探索性开始(理论)：假设每回合起点随机均匀采样。ε-贪心(实用)：每步都有探索概率，更现实可行。" },
          ]},
        { name: "Sarsa ❮同策略 on-policy❯", color: "#ef4444", cat: "3.7 Sarsa",
          desc: "行为策略 = 目标策略。用实际执行的 $a_{t+1}$ 更新，考虑探索影响 → 保守安全，悬崖行走中远离悬崖绕行。",
          children: [
            { name: "Sarsa 更新公式", color: "#f87171", cat: "3.7",
              desc: "$Q(s_t,a_t)\\leftarrow Q(s_t,a_t)+\\alpha[r_{t+1}+\\gamma Q(s_{t+1},a_{t+1})-Q(s_t,a_t)]$。名称来自五元组 $(s_t,a_t,r_{t+1},s_{t+1},a_{t+1})$。" },
            { name: "n步Sarsa / Sarsa(λ)", color: "#f87171", cat: "3.7",
              desc: "$n=1$=单步Sarsa，$n=\\infty$=MC控制。$\\lambda$ 对所有n步回报加权求和：$Q_t^\\lambda=(1-\\lambda)\\sum\\lambda^{n-1}Q_t^n$。" },
            { name: "保守行为特征", color: "#f87171", cat: "3.7",
              desc: "知道自己下一步可能随机探索 → 优化时主动避开危险区域。Sarsa路径：绕远但安全。" },
          ]},
        { name: "Q-learning ❮异策略 off-policy❯", color: "#ef4444", cat: "3.8 QL",
          desc: "行为策略 $\\mu$ $\\neq$ 目标策略 $\\pi$。用 $\\max_a Q(s',a)$ 更新，不关心实际探索 → 激进高效，悬崖行走中贴悬崖走最短路径。",
          children: [
            { name: "Q-learning 更新公式", color: "#f87171", cat: "3.8",
              desc: "$Q(s_t,a_t)\\leftarrow Q(s_t,a_t)+\\alpha[r_{t+1}+\\gamma\\max_a Q(s_{t+1},a)-Q(s_t,a_t)]$。只需 $(s,a,r,s')$ 四元组，无需 $a_{t+1}$。" },
            { name: "目标策略 π ❬军师❭", color: "#f87171", cat: "3.8",
              desc: "$\\pi(s)=\\arg\\max_a Q(s,a)$。纯贪心，不与环境交互，只从数据中学习最优策略。" },
            { name: "行为策略 μ ❬战士❭", color: "#f87171", cat: "3.8",
              desc: "$\\varepsilon$-贪心探索环境，采集轨迹数据喂给目标策略。像海盗大胆冒险，把经验写给军师。" },
            { name: "异策略三大优势", color: "#f87171", cat: "3.8",
              desc: "①更高效探索；②可模仿学习（学其他智能体/人类的轨迹）；③可重用旧经验→DQN经验回放的基础。" },
          ]},
        { name: "On-policy vs Off-policy", color: "#dc2626", cat: "3.9 对比",
          desc: "核心区别在TD目标：Sarsa用 $Q(s',a')$（实际），Q-learning用 $\\max_a Q(s',a)$（最优）。Sarsa保守绕行，Q-learning激进贴崖。" },
      ]
    },

    // =========== 本章总结 ===========
    {
      name: "本章总结：四板斧",
      color: "#64748b", cat: "总结",
      desc: "动机(有→免模型) → 工具(Q表格) → 预测(MC/TD/统一视角) → 控制(Sarsa/Q-learning)。表格型方法是深度RL的地基。",
      children: [
        { name: "四种方法对比", color: "#94a3b8", cat: "总结",
          desc: "DP=有模型+自举+不采样；MC=免模型+不自举+回合采样；TD=免模型+自举+单步采样；穷举=广度+深度皆最大。" },
        { name: "预测 vs 控制", color: "#94a3b8", cat: "总结",
          desc: "预测：给定 $\\pi$ 求 $V_\\pi$ 或 $Q_\\pi$。控制：找 $\\pi^*$ 使价值最大。GPI 统一两者：评估与改进交替迭代。" },
        { name: "探索 vs 利用", color: "#94a3b8", cat: "总结",
          desc: "利用=选已知最好的；探索=尝试未知的。$\\varepsilon$-贪心是最简平衡。同策略需兼顾两者，异策略可分离 → 学得更快。" },
      ]
    }
  ]
};
const W = window.innerWidth, H = window.innerHeight;
const dx = 220, dy = 50;

const svg = d3.select("body").append("svg").attr("width", W).attr("height", H);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.12, 2.5])
  .on("zoom", ev => g.attr("transform", ev.transform)));

const root = d3.hierarchy(treeData);
d3.tree().nodeSize([dy, dx])(root);

let x0 = Infinity, x1 = -x0;
root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
const OX = 100, OY = H/2 - (x0+x1)/2;
root.each(d => { d.y += OX; d.x += OY; });

// ───────── RENDER ─────────
const defs = svg.append("defs");
defs.append("filter").attr("id","card-shadow").html(
  '<feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>');

g.append("g")
  .selectAll("path").data(root.links()).join("path")
  .attr("class", "link")
  .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

const nodeG = g.append("g")
  .selectAll("g").data(root.descendants()).join("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.y},${d.x})`);

const tmpText = svg.append("text")
  .style("font-family","'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif")
  .style("font-size","12.5px").style("font-weight","600")
  .style("visibility","hidden");
const textW = d => { tmpText.text(d.data.name); return tmpText.node().getComputedTextLength(); };
tmpText.remove();

nodeG.append("rect")
  .attr("x", d => { const w = textW(d); return d.depth===0 ? -w/2-14 : -8; })
  .attr("y", -13)
  .attr("width", d => { const w = textW(d); return d.depth===0 ? w+28 : w+16; })
  .attr("height", 26)
  .attr("fill", d => d.data.color)
  .attr("fill-opacity", d => d.depth===0 ? 0.25 : d.children ? 0.2 : 0.14)
  .attr("stroke", d => d.data.color)
  .attr("stroke-opacity", 0.45)
  .attr("stroke-width", 1.2)
  .attr("filter", "url(#card-shadow)");

nodeG.filter(d => d.depth > 0).append("circle")
  .attr("cx", -13).attr("cy", 0)
  .attr("r", d => d.children ? 5 : 3.5)
  .attr("fill", d => d.data.color);

nodeG.append("text")
  .text(d => d.data.name)
  .attr("x", 0).attr("y", 4.5)
  .attr("text-anchor", d => d.depth===0 ? "middle" : "start")
  .attr("fill", "#e2e8f0")
  .style("font-size", d => d.depth<=1 ? "13px" : "12px")
  .style("font-weight", d => d.depth<=1 ? 700 : 500)
  .style("letter-spacing", ".2px");

// ───────── TOOLTIP ─────────
const tip = d3.select("#tooltip");
const tipNode = tip.node();
nodeG.on("mouseenter", (ev, d) => {
  tip.style("opacity","1").html(`
    <div class="cat">${d.data.cat ? '📂 ' + d.data.cat : '📖 根节点'}</div>
    <b style="color:${d.data.color}">${d.data.name}</b>
    <div style="color:#cbd5e1;font-size:12px;margin-top:5px;">${d.data.desc||''}</div>
  `);
  renderMath(tipNode);
}).on("mousemove", ev => {
  tip.style("left",(ev.pageX+16)+"px").style("top",(ev.pageY-12)+"px");
}).on("mouseleave", () => tip.style("opacity","0"));

// ───────── INITIAL FIT ─────────
setTimeout(() => {
  const bb = g.node().getBBox();
  const s = Math.min(0.85, W/bb.width, H/bb.height);
  const tx = (W - bb.width*s)/2 - bb.x*s;
  const ty = (H - bb.height*s)/2 - bb.y*s;
  svg.transition().duration(600)
    .call(d3.zoom().transform, d3.zoomIdentity.translate(tx,ty).scale(s));
}, 100);
</script>
</body>
</html>
